<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F4EE;
    --paper-dim:#E6EADF;
    --ink:#16241B;
    --ink-soft:#46604E;
    --green:#1C2E20;
    --green-soft:#2D4433;
    --header:#26402E;
    --footer:#466140;
    --wood:#3E2C1E;
    --wood-light:#9AA3A8;
    --wood-line:rgba(242,244,238,0.16);
    --accent:#3F6B46;
    --moss:#8FA463;
    --line:rgba(22,36,27,0.18);
    --line-on-dark:rgba(234,240,228,0.22);
    --paper-soft:rgba(242,244,238,0.72);
    --radius:2px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; overflow-x:hidden;}
  body{
    margin:0;
    width:100%;
    overflow-x:hidden;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:500;
    margin:0;
  }
  .mono{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.03em;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- Layout shell ---------- */
  .wrap{max-width:1120px; margin:0 auto; padding:0 32px;}
  @media (max-width:640px){ .wrap{padding:0 20px;} }

  header.site{
    position:sticky; top:0; z-index:40;
    background:var(--header);
    border-bottom:1px solid var(--line-on-dark);
    color:var(--paper);
  }
  .nav-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 0;
    max-width:1120px; margin:0 auto; padding-left:32px; padding-right:32px;
  }
  .wordmark{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.35rem;
    letter-spacing:0.01em;
    display:flex; flex-direction:column; gap:3px; align-items:flex-start;
  }
  .wm-top{
    display:flex; align-items:center; gap:7px;
  }
  .brand-sub{
    font-size:0.74em; font-weight:500; transform:translateY(0.14em);
  }
  .ofs-word{
    display:inline-block; transform:translateY(-0.02em);
    font-size:0.9em;
  }
  .ofs-word sub{
    font-size:0.86em; line-height:0; font-weight:inherit; vertical-align:-0.16em;
  }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .wordmark .tagline{
    font-family:'IBM Plex Mono', monospace; font-size:0.56rem;
    letter-spacing:0.14em; color:var(--paper-soft); font-weight:400;
    text-transform:uppercase;
    align-self:flex-end;
  }
  nav.primary{display:flex; gap:2px; align-items:center;}
  nav.primary button.navlink{
    background:none; border:none; cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--paper-soft);
    padding:10px 14px;
    border-bottom:1px solid transparent;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  nav.primary button.navlink:hover{color:var(--paper);}
  nav.primary button.navlink[aria-current="page"]{
    color:var(--paper); border-bottom-color:var(--moss);
  }
  .cta-btn{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem;
    letter-spacing:0.08em; text-transform:uppercase;
    background:transparent; color:var(--ink);
    border:1px solid var(--ink);
    padding:11px 18px; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .cta-btn:hover{background:var(--accent); color:var(--paper); border-color:var(--accent);}
  .nav-row .cta-btn{background:var(--paper); color:var(--header); border-color:var(--paper);}
  .nav-row .cta-btn:hover{background:var(--moss); color:var(--header); border-color:var(--moss);}
  .hide-mobile{display:inline-flex;}
  .menu-toggle{display:none; background:none; border:none; color:var(--paper); padding:8px; cursor:pointer; align-items:center; justify-content:center;}
  .menu-toggle svg{display:block;}
  @media (max-width:960px){
    nav.primary{display:none;}
    nav.primary.open{
      display:flex; flex-direction:column; align-items:flex-start;
      position:absolute; left:0; right:0; top:64px;
      background:var(--wood); border-bottom:1px solid var(--wood-line);
      padding:8px 20px 18px;
    }
    .menu-toggle{display:inline-flex;}
    .hide-mobile{display:none;}
  }

  section{scroll-margin-top:110px;}
  section + section{border-top:1px solid var(--line);}

  /* ---------- dot-leader utility (signature motif) ---------- */
  .leader{
    flex:1; overflow:hidden; position:relative; top:-0.35em;
    border-bottom:1px dotted var(--ink-soft);
    margin:0 10px;
  }
  .leader.on-dark{border-bottom-color:var(--line-on-dark);}
  .row-leader{display:flex; align-items:baseline;}

  /* ---------- Home ---------- */
  .hero{padding:96px 0 72px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem;
    letter-spacing:0.18em; text-transform:uppercase; color:var(--accent);
    margin-bottom:22px;
  }
  .hero h1{
    font-size:clamp(2.6rem, 6vw, 4.6rem);
    line-height:1.04;
    max-width:14ch;
  }
  .hero h1 em{font-style:italic; color:var(--green);}
  .hero-subhead{
    font-family:'Fraunces', serif; font-style:italic; color:var(--accent);
    font-size:1.3rem; margin:16px 0 0;
  }
  .hero-note{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);
    margin:10px 0 0;
  }
  .hero-categories{
    font-family:'Fraunces', serif; font-style:italic; color:var(--ink);
    font-size:1.05rem; max-width:46ch; margin:32px 0 0;
    padding-top:20px; border-top:1px solid var(--line);
  }
  .hero p.lede{
    font-size:1.1rem; color:var(--ink-soft); max-width:46ch;
    margin-top:14px; line-height:1.6;
  }
  .hero p.lede:first-of-type{margin-top:26px;}
  .hero-actions{display:flex; gap:14px; margin-top:36px; flex-wrap:wrap;}
  .btn-outline{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem;
    letter-spacing:0.08em; text-transform:uppercase;
    background:transparent; color:var(--ink);
    border:1px solid var(--ink); padding:11px 18px; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .btn-outline:hover{background:var(--accent); color:var(--paper); border-color:var(--accent);}

  .preview-strip{
    background:var(--green); color:var(--paper);
    padding:56px 0; margin-top:8px;
  }
  .preview-strip .label{
    font-family:'IBM Plex Mono', monospace; font-size:0.7rem;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--moss);
    margin-bottom:24px;
  }
  .preview-item{
    display:flex; align-items:baseline; gap:10px;
    padding:14px 0; border-bottom:1px solid var(--line-on-dark);
    font-family:'Fraunces', serif; font-size:1.15rem;
  }
  .preview-item:last-child{border-bottom:none;}
  .preview-item .price{font-family:'IBM Plex Mono', monospace; font-size:0.85rem; color:var(--moss);}

  .split{
    display:grid; grid-template-columns:1fr 1fr; gap:56px;
    padding:88px 0; align-items:center;
  }
  @media (max-width:820px){ .split{grid-template-columns:1fr; gap:32px; padding:56px 0;} }
  .frame{
    aspect-ratio:4/5; border:1px dashed var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    text-align:center; color:var(--ink-soft); padding:24px;
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.06em;
    background:var(--paper-dim);
  }
  .split h2{font-size:2rem; margin-bottom:18px;}
  .split p{color:var(--ink-soft); line-height:1.7; margin-bottom:16px;}

  /* ---------- Section heads ---------- */
  .page-head{padding:72px 0 40px;}
  .page-head .eyebrow{margin-bottom:14px;}
  .page-head h2{font-size:clamp(2rem, 4vw, 3rem);}
  .page-head p{color:var(--ink-soft); max-width:56ch; margin-top:18px; line-height:1.65;}

  /* ---------- Menus ---------- */
  .menu-tabs{display:flex; gap:8px; margin:36px 0 8px; flex-wrap:wrap;}
  .menu-tab{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem;
    letter-spacing:0.06em; text-transform:uppercase;
    background:transparent; border:1px solid var(--ink); padding:10px 16px; cursor:pointer;
    color:var(--ink);
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .menu-tab:hover{background:var(--accent); color:var(--paper); border-color:var(--accent);}
  .menu-tab[aria-selected="true"]{background:var(--accent); color:var(--paper); border-color:var(--accent);}
  .menu-card{display:none; padding:36px 0 80px;}
  .menu-card.active{display:block;}
  .menu-card .card-head{display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:8px; flex-wrap:wrap; gap:8px;}
  .menu-card .card-head h3{font-size:1.7rem;}
  .menu-card .card-head .price-tag{font-family:'IBM Plex Mono',monospace; font-size:0.85rem; color:var(--accent);}
  .menu-tagline{font-family:'Fraunces', serif; font-style:italic; color:var(--accent); font-size:1rem; margin:28px 0 0;}
  .course{padding:28px 0 0;}
  .course .row-leader{margin-bottom:6px;}
  .course .num{font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--accent); min-width:20px;}
  .course .name{font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft);}
  .dish{padding-left:30px; margin-top:14px;}
  .dish + .dish{margin-top:20px;}
  .dish-name{font-family:'Fraunces', serif; font-weight:600; font-size:1.2rem; color:var(--ink); margin:0;}
  .dish-desc{font-family:'Fraunces', serif; font-style:italic; color:var(--ink-soft); font-size:1rem; margin:4px 0 0;}
  .menu-note{margin-top:28px; font-size:0.85rem; color:var(--ink-soft); border-left:2px solid var(--moss); padding-left:14px;}

  /* ---------- Gallery ---------- */
  .gallery-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; padding-bottom:80px;}
  @media (max-width:820px){ .gallery-grid{grid-template-columns:repeat(2, 1fr);} }
  @media (max-width:520px){ .gallery-grid{grid-template-columns:1fr;} }
  .plate{
    aspect-ratio:1/1; border:1px dashed var(--ink-soft); background:var(--paper-dim);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    color:var(--ink-soft); text-align:center; padding:16px;
  }
  .plate .plate-num{font-family:'IBM Plex Mono', monospace; font-size:0.7rem; letter-spacing:0.1em; color:var(--accent);}
  .plate .plate-label{font-family:'Fraunces', serif; font-size:0.95rem; font-style:italic;}

  /* ---------- About ---------- */
  .about-body{padding:8px 0 80px; max-width:70ch;}
  .about-body p{line-height:1.75; color:var(--ink-soft); margin-bottom:20px; font-size:1.02rem;}
  .stat-row{display:flex; gap:44px; margin:40px 0 8px; flex-wrap:wrap;}
  .stat .num{font-family:'Fraunces', serif; font-size:2.2rem;}
  .stat .lbl{font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft);}

  /* ---------- FAQ ---------- */
  .faq-list{padding:8px 0 80px;}
  .faq-item{padding:26px 0; border-bottom:1px solid var(--line);}
  .faq-q{display:flex; gap:14px; align-items:baseline; margin-bottom:12px;}
  .faq-q .num{font-family:'IBM Plex Mono', monospace; font-size:0.75rem; color:var(--accent); min-width:22px;}
  .faq-q .q-text{font-family:'Fraunces', serif; font-weight:600; font-size:1.15rem; color:var(--ink);}
  .faq-answer{color:var(--ink-soft); font-size:0.98rem; line-height:1.65; padding-left:36px; max-width:65ch;}
  .inline-link{color:var(--accent); text-decoration:underline; text-underline-offset:2px; cursor:pointer; background:none; border:none; font:inherit; padding:0;}
  .inline-link:hover{color:var(--ink);}

  /* ---------- Cancellation Policy ---------- */
  .policy-body{padding:8px 0 80px; max-width:70ch;}
  .policy-body p{line-height:1.75; color:var(--ink-soft); margin-bottom:20px; font-size:1.02rem;}

  /* ---------- Contact ---------- */
  .contact-wrap{display:grid; grid-template-columns:1fr 1fr; gap:60px; padding-bottom:96px;}
  @media (max-width:820px){ .contact-wrap{grid-template-columns:1fr; gap:36px;} }
  .contact-info{display:flex; flex-direction:column; gap:22px;}
  .contact-info .item{display:flex; flex-direction:column; gap:4px;}
  .contact-info .k{font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft);}
  .contact-info .v{font-family:'Fraunces', serif; font-size:1.15rem;}
  form.book label{display:block; font-family:'IBM Plex Mono', monospace; font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;}
  form.book .field{margin-bottom:22px;}
  form.book input, form.book textarea{
    width:100%; background:var(--paper-dim); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 12px; font-family:'Work Sans', sans-serif; font-size:1rem; color:var(--ink);
  }
  form.book input:focus, form.book textarea:focus{border-color:var(--accent);}
  form.book textarea{resize:vertical; min-height:90px;}
  form.book .row2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:480px){ form.book .row2{grid-template-columns:1fr;} }
  .form-status{margin-top:14px; font-size:0.9rem; min-height:1.2em;}
  .form-status.success{color:var(--accent);}
  .form-status.error{color:#8a3a3a;}
  .field-note{display:block; font-size:0.78rem; color:var(--ink-soft); margin-top:6px;}

  /* ---------- Footer ---------- */
  footer{background:var(--footer); color:var(--wood-light); padding:44px 0;}
  footer .foot-row{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:12px;}
  footer .foot-row .mono{font-size:0.7rem; letter-spacing:0.06em; color:var(--wood-light); opacity:0.75;}
</style>
</head>
